name: astronexus

services:
  dsh:
    build:
      context: ../services/dsh
      dockerfile: Dockerfile
      args:
        DSH_VERSION: 0.2.1-rc.2
    image: astronexus/dsh:0.2.1-rc.2
    environment:
      DSH_HOME: /home/dsh/.dsh
      DSH_PROFILE: astronexus-web
      DSH_PERMISSION_MODE: ${DSH_PERMISSION_MODE:-workspace-write}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DSH_TELEMETRY_MODE: DISABLED
      DSH_TELEMETRY_DISABLED: "1"
      # 反代时设置：https://your.domain/ 与该域名
      DSH_PUBLIC_URL: ${DSH_PUBLIC_URL:-}
      DSH_TRUSTED_HOST: ${DSH_TRUSTED_HOST:-}
    ports:
      - "${DSH_PORT:-3080}:3080"
    volumes:
      - dsh-home:/home/dsh/.dsh
      - ${WORKSPACE_DIR:-./workspace}:/workspace
    working_dir: /workspace
    stdin_open: true
    tty: true
    restart: unless-stopped

  caddy:
    image: caddy:2
    profiles: ["proxy"]
    depends_on:
      - dsh
    ports:
      - "80:80"
      - "443:443"
    environment:
      ASTRO_DOMAIN: ${ASTRO_DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped

  # 后续接入（docs/14 §1）：
  # memory / reflect / orchestrate 作为插件跑在 dsh 进程内，不再单列服务。

volumes:
  dsh-home:
  caddy-data:
  caddy-config:
